apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialpublish-api
  namespace: socialpublish
  labels:
    app: socialpublish-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: socialpublish-api
  template:
    metadata:
      labels:
        app: socialpublish-api
    spec:
      containers:
        - name: api
          image: ghcr.io/yourorg/socialpublish:server-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: socialpublish-config
                  key: LISTEN_ADDR
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: socialpublish-secrets
                  key: database-url
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: socialpublish-config
                  key: REDIS_ADDR
            - name: FFMPEG_BIN
              valueFrom:
                configMapKeyRef:
                  name: socialpublish-config
                  key: FFMPEG_BIN
            - name: S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: socialpublish-config
                  key: S3_REGION
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: socialpublish-config
                  key: S3_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: socialpublish-config
                  key: S3_BUCKET
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: socialpublish-secrets
                  key: s3-access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: socialpublish-secrets
                  key: s3-secret-access-key
